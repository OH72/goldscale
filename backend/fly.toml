app = 'goldscale'
primary_region = 'waw'

[build]

[env]
  JAVA_TOOL_OPTIONS = '-Xmx384m -Xss512k -XX:+UseSerialGC'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[checks]
  [checks.health]
    type = 'http'
    port = 8080
    path = '/api/accounts'
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
