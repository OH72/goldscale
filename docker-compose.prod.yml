services:
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/goldscale_prod?replicaSet=rs0
      APP_AUTH_USERNAME: admin
      APP_AUTH_PASSWORD: admin
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
